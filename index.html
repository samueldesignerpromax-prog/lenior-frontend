<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lenior Chat</title>
    <style>
        /* ===== Reset e Base ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0b0e14;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #e8edf5;
        }

        /* ===== Container Principal ===== */
        .chat-container {
            width: 100%;
            max-width: 820px;
            height: 95vh;
            max-height: 720px;
            background: #161c26;
            border-radius: 28px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #2a3340;
        }

        /* ===== Header ===== */
        .chat-header {
            background: #1f2937;
            padding: 18px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid #2a3340;
            flex-shrink: 0;
        }

        .chat-header .avatar {
            width: 46px;
            height: 46px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
        }

        .chat-header .info h1 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .chat-header .info span {
            font-size: 14px;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chat-header .info span .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #22c55e;
            border-radius: 50%;
            animation: pulse-dot 1.8s infinite;
        }

        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.8);
            }
        }

        /* ===== Área de Mensagens ===== */
        .messages-area {
            flex: 1;
            padding: 24px 24px 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            background: #0f151e;
            scroll-behavior: smooth;
        }

        .messages-area::-webkit-scrollbar {
            width: 5px;
        }
        .messages-area::-webkit-scrollbar-track {
            background: transparent;
        }
        .messages-area::-webkit-scrollbar-thumb {
            background: #2a3340;
            border-radius: 10px;
        }

        /* ===== Mensagens ===== */
        .message {
            max-width: 82%;
            padding: 12px 18px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.6;
            word-break: break-word;
            animation: fade-in 0.3s ease;
            position: relative;
        }

        @keyframes fade-in {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            background: #2563eb;
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .message.assistant {
            align-self: flex-start;
            background: #1e293b;
            color: #e8edf5;
            border-bottom-left-radius: 4px;
            border: 1px solid #2a3340;
        }

        .message.error {
            border-color: #ef4444 !important;
            background: #1e293b !important;
            color: #fca5a5 !important;
        }

        .message .role-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.5;
            margin-bottom: 4px;
        }

        .message.user .role-label {
            text-align: right;
        }

        /* ===== Indicador de Digitação ===== */
        .typing-indicator {
            align-self: flex-start;
            background: #1e293b;
            padding: 12px 20px;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            border: 1px solid #2a3340;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #94a3b8;
        }

        .typing-indicator .dots span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #94a3b8;
            border-radius: 50%;
            margin: 0 2px;
            animation: typing-bounce 1.4s infinite both;
        }

        .typing-indicator .dots span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .typing-indicator .dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing-bounce {
            0%,
            80%,
            100% {
                transform: scale(0.6);
                opacity: 0.4;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* ===== Boas-vindas ===== */
        .welcome {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            color: #64748b;
            gap: 8px;
        }

        .welcome .icon {
            font-size: 60px;
            margin-bottom: 10px;
        }

        .welcome h2 {
            font-size: 24px;
            color: #e8edf5;
            font-weight: 500;
        }

        .welcome p {
            font-size: 15px;
            max-width: 380px;
        }

        /* ===== Input Area ===== */
        .input-area {
            background: #1f2937;
            padding: 14px 20px;
            display: flex;
            gap: 12px;
            border-top: 1px solid #2a3340;
            align-items: center;
            flex-shrink: 0;
        }

        .input-area input {
            flex: 1;
            padding: 13px 20px;
            border: none;
            border-radius: 40px;
            background: #0f151e;
            color: #e8edf5;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
            border: 1px solid transparent;
        }

        .input-area input::placeholder {
            color: #64748b;
        }

        .input-area input:focus {
            border-color: #3b82f6;
            background: #161c26;
        }

        .input-area input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .input-area button {
            background: #2563eb;
            border: none;
            color: #fff;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            font-size: 22px;
            flex-shrink: 0;
        }

        .input-area button:hover:not(:disabled) {
            background: #3b82f6;
            transform: scale(1.05);
        }

        .input-area button:disabled {
            background: #334155;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== Responsivo ===== */
        @media (max-width: 640px) {
            .chat-container {
                height: 100vh;
                max-height: none;
                border-radius: 0;
                border: none;
            }
            .messages-area {
                padding: 16px;
            }
            .input-area {
                padding: 10px 14px;
            }
            .message {
                max-width: 92%;
                font-size: 14px;
                padding: 10px 14px;
            }
            .chat-header {
                padding: 14px 16px;
            }
            .chat-header .avatar {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }
            .chat-header .info h1 {
                font-size: 17px;
            }
            .welcome .icon {
                font-size: 44px;
            }
        }

        /* ===== Spinner de carregamento no botão ===== */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s ease-in-out infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <div class="avatar">L</div>
            <div class="info">
                <h1>Lenior</h1>
                <span><span class="dot"></span> Online</span>
            </div>
        </div>

        <!-- Área de Mensagens -->
        <div class="messages-area" id="messagesArea">
            <div class="welcome" id="welcomeMessage">
                <div class="icon">👋</div>
                <h2>Olá, sou o Lenior</h2>
                <p>Pergunte qualquer coisa. Estou aqui para ajudar.</p>
            </div>
        </div>

        <!-- Input -->
        <div class="input-area">
            <input
            type="text"
            id="messageInput"
            placeholder="Digite sua mensagem..."
            autofocus
            />
            <button id="sendButton" title="Enviar">
                <span id="sendIcon">➤</span>
            </button>
        </div>
    </div>

    <script>
        // ============================================================
        // CONFIGURAÇÃO
        // ============================================================
        const API_URL = 'https://lenior-api-min.onrender.com';

        // ============================================================
        // DOM
        // ============================================================
        const messagesArea = document.getElementById('messagesArea');
        const welcomeMessage = document.getElementById('welcomeMessage');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const sendIcon = document.getElementById('sendIcon');

        // ============================================================
        // ESTADO
        // ============================================================
        let isWaiting = false;
        let sessionId = localStorage.getItem('lenior_session_id') || null;

        // ============================================================
        // FUNÇÕES AUXILIARES
        // ============================================================
        function addMessage(role, content, isError = false) {
            // Remove a mensagem de boas-vindas se existir
            if (welcomeMessage) {
                welcomeMessage.remove();
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            if (isError) messageDiv.classList.add('error');

            const label = document.createElement('div');
            label.className = 'role-label';
            label.textContent = role === 'user' ? 'Você' : 'Lenior';

            const text = document.createElement('div');
            text.textContent = content;

            messageDiv.appendChild(label);
            messageDiv.appendChild(text);
            messagesArea.appendChild(messageDiv);
            scrollToBottom();
        }

        function showTyping() {
            const typing = document.createElement('div');
            typing.className = 'typing-indicator';
            typing.id = 'typingIndicator';
            typing.innerHTML = `
            <span>Lenior está pensando</span>
            <span class="dots">
              <span></span>
              <span></span>
              <span></span>
            </span>
          `;
            messagesArea.appendChild(typing);
            scrollToBottom();
        }

        function removeTyping() {
            const typing = document.getElementById('typingIndicator');
            if (typing) typing.remove();
        }

        function scrollToBottom() {
            messagesArea.scrollTop = messagesArea.scrollHeight;
        }

        function setWaiting(state) {
            isWaiting = state;
            sendButton.disabled = state;
            messageInput.disabled = state;
            if (state) {
                sendIcon.innerHTML = '<span class="spinner"></span>';
            } else {
                sendIcon.textContent = '➤';
            }
            if (!state) messageInput.focus();
        }

        // ============================================================
        // ENVIAR MENSAGEM
        // ============================================================
        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || isWaiting) return;

            // Limpa input
            messageInput.value = '';

            // Adiciona mensagem do usuário
            addMessage('user', text);

            // Mostra indicador de digitação
            showTyping();
            setWaiting(true);

            try {
                const payload = { texto: text };
                if (sessionId) payload.sessao_id = sessionId;

                const response = await fetch(`${API_URL}/chat/texto`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });

                // Tenta ler a resposta como JSON
                let data;
                const contentType = response.headers.get('content-type');
                if (contentType && contentType.includes('application/json')) {
                    data = await response.json();
                } else {
                    const textError = await response.text();
                    throw new Error(`Servidor retornou ${response.status}: ${textError || 'resposta não JSON'}`);
                }

                if (!response.ok) {
                    throw new Error(data.erro || data.message || `Erro ${response.status}`);
                }

                // Remove indicador
                removeTyping();

                // Atualiza sessionId se veio da resposta
                if (data.sessao_id) {
                    sessionId = data.sessao_id;
                    localStorage.setItem('lenior_session_id', sessionId);
                }

                // Obtém a resposta
                const resposta = data.resposta || data.answer || data.mensagem || 'Desculpe, não entendi.';
                addMessage('assistant', resposta);

            } catch (error) {
                console.error('Erro detalhado:', error);
                removeTyping();
                // Mostra erro mais informativo
                let errorMsg = error.message || 'Erro ao conectar com o servidor.';
                // Se for erro de rede, dá uma mensagem mais amigável
                if (error.message.includes('Failed to fetch') || error.message.includes('NetworkError')) {
                    errorMsg = 'Não foi possível conectar ao servidor. Verifique sua internet ou tente novamente mais tarde.';
                }
                addMessage('assistant', `❌ ${errorMsg}`, true);
            } finally {
                setWaiting(false);
            }
        }

        // ============================================================
        // EVENTOS
        // ============================================================
        sendButton.addEventListener('click', sendMessage);

        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });

        // ============================================================
        // INICIALIZAÇÃO
        // ============================================================
        // Foco no input ao carregar
        messageInput.focus();

        // (Opcional) Teste de conectividade ao carregar a página
        async function checkHealth() {
            try {
                const res = await fetch(`${API_URL}/health`);
                if (res.ok) {
                    const data = await res.json();
                    console.log('✅ API online:', data);
                } else {
                    console.warn('⚠️ API não respondeu com status ok');
                }
            } catch (e) {
                console.warn('⚠️ Não foi possível verificar a saúde da API:', e.message);
            }
        }
        checkHealth();
    </script>
</body>
</html>
